name: Keep Supabase Alive

# Mencegah project Supabase free-tier "MBG Order Dapur" auto-pause karena
# tidak ada aktivitas selama 7 hari. Workflow ini melakukan 1 request ringan
# (read-only) ke REST API Supabase setiap 3 hari, jauh di bawah batas 7 hari,
# supaya project selalu dianggap aktif.

on:
  schedule:
    - cron: '0 3 */3 * *'   # setiap 3 hari sekali, jam 03:00 UTC (= 10:00 WIB)
  workflow_dispatch: {}       # tombol "Run workflow" manual di tab Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://mvliluqrkzywojjnqxdm.supabase.co/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bGlsdXFya3p5d29qam5xeGRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMjU1MjIsImV4cCI6MjA5NjgwMTUyMn0.I9tRfUBBxO6T12Fct2Tl0T_po5keT8H7Eq7Cmboudmw
